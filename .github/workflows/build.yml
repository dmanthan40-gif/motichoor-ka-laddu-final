name: Build APK

# Builds without relying on a committed Gradle wrapper jar, since this repo is
# meant to be edited/pushed straight from a phone (no local machine to run
# `gradle wrapper` on). gradle/actions/setup-gradle installs Gradle itself.
#
# Every push publishes a GitHub Release with the APK attached, so the final
# download is just: open the repo in Chrome -> Releases -> tap the .apk.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: gradle assembleDebug -PGROQ_API_KEY="$GROQ_API_KEY" -POPENAI_API_KEY="$OPENAI_API_KEY"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MotichoorKaLaddu.apk

      - name: Upload build artifact (visible under the Actions tab too)
        uses: actions/upload-artifact@v4
        with:
          name: motichoor-ka-laddu-debug
          path: MotichoorKaLaddu.apk

      - name: Publish a browser-downloadable Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: MotichoorKaLaddu.apk
